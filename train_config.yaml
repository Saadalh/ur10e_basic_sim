# Local OpenPI checkout that supplies the pi0.5 JAX training code.
openpi-root: /home/rahmlab/projects/vlas/openpi

# Local LeRobot v3 dataset generated by collect_cube_data.py.
dataset-path: /home/rahmlab/projects/isaac_simulations/ur10e_basic/data

# Released pi0.5-DROID checkpoint used to initialize fine-tuning.
base-checkpoint: gs://openpi-assets/checkpoints/pi05_droid

# DROID normalization asset bundled with the released checkpoint.
pretrained-assets-id: droid

# Stable OpenPI configuration name used below the output directories.
config-name: pi05_ur10e_lora

# Human-readable experiment name used for this checkpoint run.
experiment-name: ur10e_cube_tasks

# Weights & Biases project name when online logging is enabled.
project-name: ur10e-pi05

# Directory in which OpenPI writes training checkpoints.
checkpoint-base-dir: /home/rahmlab/projects/isaac_simulations/ur10e_basic/checkpoints

# Directory in which OpenPI may cache or copy data assets.
assets-base-dir: /home/rahmlab/projects/isaac_simulations/ur10e_basic/assets

# LoRA is the standard low-memory choice; use "full" only on much larger GPUs.
fine-tuning-method: lora

# Documented per-GPU memory floor for pi0.5 LoRA fine-tuning, in GiB.
minimum-lora-vram-gb: 22.5

# Documented per-GPU memory floor for full pi0.5 fine-tuning, in GiB.
minimum-full-vram-gb: 70.0

# Dataset episode indexes to omit; an empty list keeps every episode.
ignore-episodes: []

# Number of future actions predicted in each policy chunk.
action-horizon: 15

# Keep pi0.5's checkpoint-compatible action width; physical actions occupy 8 slots.
model-action-dim: 32

# pi0.5's standard prompt/state token budget.
max-token-length: 200

# Global examples per optimizer step; 32 matches OpenPI's DROID fine-tuning recipe.
batch-size: 32

# Number of optimizer updates in a normal fine-tuning run.
num-train-steps: 20000

# Data-loading worker processes; two limits concurrent random video decoders.
num-workers: 2

# Reproducible random seed for initialization and data shuffling.
seed: 42

# Linear warmup length before reaching the peak learning rate.
warmup-steps: 1000

# Typical low learning-rate peak for LoRA adaptation.
peak-learning-rate: 0.000025

# Step at which cosine decay reaches its final learning rate.
learning-rate-decay-steps: 20000

# Final learning rate after cosine decay.
final-learning-rate: 0.0000025

# AdamW first-moment decay used by OpenPI.
adam-beta1: 0.9

# AdamW second-moment decay used by OpenPI.
adam-beta2: 0.95

# AdamW numerical-stability epsilon.
adam-epsilon: 0.00000001

# Near-zero OpenPI default weight decay for fine-tuning.
weight-decay: 0.0000000001

# Global gradient-norm clipping threshold.
gradient-clip-norm: 1.0

# Training-step interval for scalar metric logging.
log-interval: 100

# Training-step interval for writing recoverable checkpoints.
save-interval: 1000

# Preserve every Nth checkpoint indefinitely; null disables periodic retention.
keep-period: 5000

# Number of local GPUs across which OpenPI applies FSDP sharding.
fsdp-devices: 1

# Enable online Weights & Biases logging when credentials are configured.
wandb-enabled: false

# Replace an existing experiment checkpoint directory when starting.
overwrite: false

# Continue from the newest existing checkpoint instead of starting over.
resume: false

# State indexes containing the six physical UR10e arm joints.
arm-state-indices: [0, 1, 2, 3, 4, 5]

# State index containing the primary Robotiq finger joint.
gripper-state-index: 6

# Raw-action indexes containing the six executable arm velocity commands.
arm-velocity-action-indices: [24, 25, 26, 27, 28, 29]

# Raw-action index containing the signed gripper position command.
gripper-action-value-index: 6

# Raw-action index indicating whether the gripper command is present.
gripper-action-mask-index: 18

# Physical finger-joint value treated as fully open.
gripper-open-position: 0.0

# Approximate physical finger-joint value treated as fully closed.
gripper-closed-position: 0.376

# Maximum open video handles retained per loader worker.
video-capture-cache-size: 4
